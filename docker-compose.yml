services:
  postgres:
    image: postgres:16-alpine
    container_name: boostk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: boostk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boostk-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@boostk.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5052:80"
    depends_on:
      - postgres

  backend:
    build: ./hono
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/boostk
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      args:
        - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/boostk
        - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
        - BETTER_AUTH_URL=${BETTER_AUTH_URL}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/boostk
    depends_on:
      - backend
      - postgres

volumes:
  postgres_data:
