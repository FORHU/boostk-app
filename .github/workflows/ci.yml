name: CI

# WHEN should this run?
on:
  push:
    branches: [master] # runs when commits land on master (this repo's default branch)
  pull_request: # runs on every PR, targeting any branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest # the throwaway VM GitHub gives us

    # Dummy env vars so the build/typecheck don't crash on missing config.
    # These are NOT secrets and never touch a real database — they just let
    # the code that reads process.env at build time succeed.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-dummy-secret-not-real
      BETTER_AUTH_URL: http://localhost:5000/

    steps:
      # 1. Pull our repo's code onto the CI machine.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Bun (our runtime + package manager).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # pin to e.g. "1.1.38" once you want reproducibility

      # 3. Install dependencies. --frozen-lockfile means "fail if bun.lock
      #    doesn't match package.json" — catches forgotten lockfile updates.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 4. Generate the Prisma client. REQUIRED: it's written to
      #    prisma/generated/ which is gitignored, so it doesn't exist yet on a
      #    fresh checkout. Every Prisma import breaks without this.
      - name: Generate Prisma client
        run: bun prisma generate

      # 5. Lint (Biome). Catches style/formatting/obvious-bug issues.
      - name: Lint
        run: bun run lint

      # 6. Type-check the whole project with TypeScript.
      - name: Typecheck
        run: bun run typecheck

      # 7. Run the test suite (Vitest).
      #    NOTE: if any test makes a real network call (e.g. the translation
      #    test hitting FORHU_CHAT_URL), it may fail here. Mock those or move
      #    them to a separate integration suite if CI goes red on them.
      - name: Test
        run: bun run test

      # 8. Production build. Proves the app actually compiles for deploy.
      - name: Build
        run: bun run build

  # Builds the REAL production image and proves it can start. `bun run build`
  # above passing does not prove the container works — the whole 0.1-0.5 class
  # of blockers (missing .output, ungenerated Prisma client, schema engine that
  # cannot run on Alpine) only shows up here. Catching it on a PR is much
  # cheaper than catching it halfway through a production deploy.
  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_SOCKET_URL=http://localhost:3001 \
            --build-arg VITE_SUPPORT_PROJECT_ID=ci-dummy \
            -t boostk:ci .

      # `prisma -v` executes the schema engine binary to report its version.
      # If OpenSSL is missing from the image, or the linux-musl engine never
      # downloaded, this fails here — the same binary `migrate deploy` needs.
      - name: Schema engine can run
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/ci \
            boostk:ci bun prisma -v

      # Proves .output/server/index.mjs exists and the entrypoint boots.
      # Checks the process is still alive rather than requiring HTTP 200 —
      # there is no database here, so the app may legitimately error on a
      # request while still having started correctly.
      #
      # The image sets NODE_ENV=production (Dockerfile), so src/env.ts enforces
      # its REQUIRED_IN_PRODUCTION list at import time and the container refuses
      # to boot if any is missing. KEEP THESE IN SYNC with that list
      # (src/env.ts) — adding a var there without adding it here fails CI with
      # "✖ Invalid environment configuration". Values are throwaway: nothing
      # here connects to a real broker or database.
      - name: Container starts and stays up
        run: |
          docker run -d --name boostk-ci \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/ci \
            -e BETTER_AUTH_SECRET=ci-dummy-secret-not-real \
            -e BETTER_AUTH_URL=http://localhost:5000/ \
            -e TRUSTED_ORIGINS=http://localhost:5000 \
            -e RABBITMQ_URL=amqp://user:pass@localhost:5672 \
            boostk:ci
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' boostk-ci)" != "true" ]; then
            echo "❌ container exited — .output missing or entrypoint broken"
            docker logs boostk-ci
            exit 1
          fi
          echo "✅ container still running after 10s"
          docker rm -f boostk-ci
