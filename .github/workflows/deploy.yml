name: Deploy to EC2

on:
  workflow_dispatch: # manual "Run workflow" button — safe default while learning
  # push:
  #   branches: [master]   # <-- uncomment later for fully automatic deploys

env:
  # Dedicated repo:
  # arn:aws:ecr:ap-southeast-1:617163942417:repository/boostk
  # Only the NAME goes here — the registry host comes from the ecr-login step.
  ECR_REPOSITORY: boostk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to AWS so we can push to ECR.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build ON THE RUNNER (not on EC2) and push to ECR.
      #
      # VITE_* are passed as --build-arg, NOT as runtime env vars: Vite inlines
      # them into the client bundle during `bun run build`. Supplying them at
      # `docker run` time is too late — the browser would fall back to
      # localhost:3001 and never reach the socket relay.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # SHA tag is what the deploy actually pulls, so rollback can target any
          # previous commit. `:latest` is a convenience pointer for humans.
          docker build \
            --build-arg VITE_SOCKET_URL="${{ secrets.VITE_SOCKET_URL }}" \
            --build-arg VITE_SUPPORT_PROJECT_ID="${{ secrets.VITE_SUPPORT_PROJECT_ID }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # mint a fresh ECR password per deploy
      - name: Get ECR pull password
        id: ecr-pw
        run: |
          PASSWORD=$(aws ecr get-login-password)
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # Ship the compose file straight from the repo checkout, so the box can
      # never drift from what is committed. strip_components drops the leading
      # "deploy/" path segment, landing it at ~/boostk-app/.
      - name: Upload compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yaml
          target: ~/boostk-app/
          strip_components: 1

      # EC2 only logs in, pulls the prebuilt image, and swaps containers.
      # app.env is written here from individual secrets, so nothing has to be
      # created on the box by hand — same pattern as our other repos' deploy.yml.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 public IP or DNS name
          username: ${{ secrets.EC2_USER }} # usually "ubuntu" or "ec2-user"
          key: ${{ secrets.EC2_SSH_KEY }} # contents of your .pem private key
          envs: REGISTRY,IMAGE,ECR_PASSWORD
          script: |
            set -e
            mkdir -p ~/boostk-app
            cd ~/boostk-app

            umask 077
            cat > app.env << 'ENVEOF'
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
            RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}
            RABBITMQ_URL=amqp://${{ secrets.RABBITMQ_DEFAULT_USER }}:${{ secrets.RABBITMQ_DEFAULT_PASS }}@rabbitmq:5672
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            FORHU_CHAT_URL=${{ vars.FORHU_CHAT_URL }}
            SUPPORT_LANGUAGE=${{ vars.SUPPORT_LANGUAGE }}
            SOCKET_PORT=5001
            ENVEOF

            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$IMAGE"

            # docker-compose.prod.yaml interpolates ${IMAGE}, so every service
            # (app, socket relay, migration job) runs the identical commit.
            export IMAGE

            # Migrations run BEFORE the new code starts, as a one-shot container
            # from the same image. `run` (not `run --no-deps`) brings up the
            # depends_on services first, so the network and DB exist. Retried
            # because Postgres may still be accepting-connections-soon on a
            # cold start; if it never succeeds, the deploy aborts and the old
            # containers keep serving traffic.
            for i in 1 2 3 4 5; do
              if docker compose -f docker-compose.prod.yaml run --rm app \
                   bun prisma migrate deploy; then
                echo "✅ migrations applied"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "❌ migrations failed after 5 attempts — aborting deploy"
                exit 1
              fi
              echo "migrations failed (attempt $i), retrying in 5s..."
              sleep 5
            done

            docker compose -f docker-compose.prod.yaml up -d

            # Fail the deploy loudly instead of reporting green on a dead app.
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:5000/ > /dev/null; then
                echo "✅ app healthy after ${i}s"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "❌ health check failed — last 50 lines:"
                docker compose -f docker-compose.prod.yaml logs --tail=50 app
                exit 1
              fi
              sleep 1
            done

            docker image prune -f            # clean up old image layers
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ECR_PASSWORD: ${{ steps.ecr-pw.outputs.password }}
