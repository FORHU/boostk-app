name: Deploy to EC2

on:
  workflow_dispatch: # manual "Run workflow" button — safe default while learning
  # push:
  #   branches: [master]   # <-- uncomment later for fully automatic deploys

# OIDC: GitHub mints a short-lived token and AWS trades it for the deploy role.
# No long-lived AWS keys and no SSH key live in this repo's secrets any more.
permissions:
  id-token: write
  contents: read

env:
  # Dedicated repo:
  # arn:aws:ecr:ap-southeast-1:617163942417:repository/boostk
  # Only the NAME goes here — the registry host comes from the ecr-login step.
  ECR_REPOSITORY: boostk
  # SecureString holding app.env. Written here on every deploy, read by the
  # instance in deploy/remote-deploy.sh.
  ENV_PARAM: /boostk/app-env
  # Where the compose file and deploy script land on the instance.
  APP_DIR: /opt/boostk
  # Accept either tab (Settings → Secrets and variables → Actions): these are
  # not sensitive, but they have been added under Secrets before.
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  INSTANCE_ID: ${{ vars.INSTANCE_ID || secrets.INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The role needs: ECR push to `boostk`, ssm:PutParameter on
      # parameter/boostk/*, ssm:SendCommand on the instance + AWS-RunShellScript,
      # and ssm:GetCommandInvocation.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build ON THE RUNNER (not on EC2) and push to ECR.
      #
      # VITE_* are passed as --build-arg, NOT as runtime env vars: Vite inlines
      # them into the client bundle during `bun run build`. Supplying them at
      # `docker run` time is too late — the browser would fall back to
      # localhost:3001 and never reach the socket relay.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # SHA tag is what the deploy actually pulls, so rollback can target any
          # previous commit. `:latest` is a convenience pointer for humans.
          docker build \
            --build-arg VITE_SOCKET_URL="${{ secrets.VITE_SOCKET_URL }}" \
            --build-arg VITE_SUPPORT_PROJECT_ID="${{ secrets.VITE_SUPPORT_PROJECT_ID }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # app.env goes to Parameter Store, NOT into the SSM command: send-command
      # parameters are kept in plain text in the command history, readable by
      # anyone with SSM read access. The instance pulls it with its own role.
      - name: Store app.env in Parameter Store
        env:
          # One whole secret rather than a URL assembled from parts. The database is
          # managed (RDS) now, so the host, database name and connection parameters are
          # not ours to hardcode — and a password containing @ / : / ? has to be
          # percent-encoded exactly once, which is only safe to do by hand, once, when
          # the secret is written.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TRUSTED_ORIGINS: ${{ secrets.TRUSTED_ORIGINS }}
          # Google sign-in. Both or neither — src/lib/auth.ts only registers the
          # provider when it has a complete pair, so a half-configured deploy falls
          # back to email/password instead of a broken button.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FORHU_CHAT_URL: ${{ vars.FORHU_CHAT_URL }}
          SUPPORT_LANGUAGE: ${{ vars.SUPPORT_LANGUAGE }}
          PLATFORM_STAFF_EMAILS: ${{ vars.PLATFORM_STAFF_EMAILS }}
        run: |
          umask 077
          printf '%s\n' \
            "DATABASE_URL=$DATABASE_URL" \
            "RABBITMQ_DEFAULT_USER=$RABBITMQ_DEFAULT_USER" \
            "RABBITMQ_DEFAULT_PASS=$RABBITMQ_DEFAULT_PASS" \
            "RABBITMQ_URL=amqp://$RABBITMQ_DEFAULT_USER:$RABBITMQ_DEFAULT_PASS@rabbitmq:5672" \
            "BETTER_AUTH_URL=$BETTER_AUTH_URL" \
            "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" \
            "TRUSTED_ORIGINS=$TRUSTED_ORIGINS" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "FORHU_CHAT_URL=$FORHU_CHAT_URL" \
            "SUPPORT_LANGUAGE=$SUPPORT_LANGUAGE" \
            "PLATFORM_STAFF_EMAILS=$PLATFORM_STAFF_EMAILS" \
            "SOCKET_PORT=5001" > app.env
          # Intelligent-Tiering: standard (free) under 4 KB, advanced only if it grows past.
          aws ssm put-parameter --name "$ENV_PARAM" --type SecureString \
            --tier Intelligent-Tiering --overwrite --value file://app.env > /dev/null
          rm -f app.env

      # Ship the compose file and deploy script straight from the checkout, so the
      # box can never drift from what is committed, then run the script. The
      # actual deploy logic lives in deploy/remote-deploy.sh.
      - name: Deploy via SSM
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yaml)
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)
          REMOTE="set -e; mkdir -p $APP_DIR; cd $APP_DIR; \
          echo $COMPOSE_B64 | base64 -d > docker-compose.prod.yaml; \
          echo $SCRIPT_B64 | base64 -d > remote-deploy.sh; \
          IMAGE=$IMAGE REGISTRY=$REGISTRY AWS_REGION=$AWS_REGION ENV_PARAM=$ENV_PARAM bash remote-deploy.sh"
          jq -n --arg c "$REMOTE" '{commands: [$c], executionTimeout: ["1800"]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "boostk ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # send-command only queues the work — without waiting here the job goes
          # green even when the deploy on the box fails.
          STATUS=Pending
          for _ in $(seq 1 180); do # 15 min
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "::group::Instance output"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::Instance errors"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy on $INSTANCE_ID ended with status $STATUS"
            exit 1
          fi
