name: Deploy Dev

# FORHU/boostk → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL, REDIS_URL and
#      RABBITMQ_URL come from the host — do NOT set them here.

on:
  workflow_dispatch:
    inputs:
      ref:
        # No default: repos in this org do not agree on a default branch name
        # (boostk-app is master, others are main). Left blank, the checkout
        # below falls back to github.ref_name — the branch you dispatched from,
        # which always exists. A hardcoded default silently fetches a branch
        # that may not be there and fails in checkout, before any build runs.
        description: "Branch, tag or SHA to deploy (blank = the branch you ran this from)"
        required: false
  # Uncomment once a dev branch exists and the team wants push-to-deploy.
  # push:
  #   branches: [dev]

concurrency:
  group: forhu-dev-boostk
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: boostk
  NETWORK: forhu-dev
  # One image, run twice. The web app serves on 5000; the socket relay is the
  # same image started with a different command (see docker-compose.prod.yaml on
  # the production box). Caddy sends /socket.io/* to 4061 and everything else to
  # 4060 — see /etc/caddy/sites/boostk.caddy. Changing a port here without
  # changing that file breaks websockets only, which reads as an app bug.
  CONTAINER: boostk-app
  HOST_PORT: "4060"
  APP_PORT: "5000"
  SOCKET_CONTAINER: boostk-socket
  SOCKET_HOST_PORT: "4061"
  SOCKET_APP_PORT: "5001"
  SOCKET_CMD: bun run src/socket-server/index.ts
  ENV_PARAM: /forhu-dev/boostk/env
  SHARED_ENV: /opt/forhu-dev/credentials/boostk.env
  MERGED_ENV: /opt/forhu-dev/boostk.env

jobs:
  deploy:
    name: Build and deploy (boostk dev)
    # Native arm64: the host is Graviton. An image built on ubuntu-latest is
    # amd64, pulls cleanly, then dies with "exec format error". Do not
    # cross-build under QEMU — Node and Prisma builds take hours and look hung.
    runs-on: ubuntu-24.04-arm
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          # dev- prefix so a dev image can never be mistaken for, or overwrite,
          # a production tag in the same ECR repository.
          echo "tag=dev-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          # Vite inlines VITE_* at build time — they end up baked into the
          # bundle the browser downloads, not read from the container's env.
          # Passing them to `docker run` instead builds a frontend that calls
          # localhost from the tester's machine and fails silently.
          build-args: |
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
            VITE_SUPPORT_PROJECT_ID=${{ vars.VITE_SUPPORT_PROJECT_ID }}
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # This project's own secrets only. Anything unset is omitted rather than
      # written empty: an empty value looks configured and silently disables
      # whatever reads it, which is how three features were found dead on the
      # UK stack.
      - name: Publish project env to Parameter Store
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          TRUSTED_ORIGINS: ${{ vars.TRUSTED_ORIGINS }}
          FORHU_CHAT_URL: ${{ vars.FORHU_CHAT_URL }}
          SUPPORT_LANGUAGE: ${{ vars.SUPPORT_LANGUAGE }}
        run: |
          set -euo pipefail
          umask 077

          # NODE_ENV=production because the image runs a built bundle
          # (.output/server/index.mjs). Under "development" a prebuilt Nitro
          # server and better-auth change cookie and error behaviour, which is
          # not what we want to be testing on dev.
          printf 'NODE_ENV=production\n' > env.tmp
          printf 'PORT=%s\n' '${{ env.APP_PORT }}' >> env.tmp
          printf 'SOCKET_PORT=%s\n' '${{ env.SOCKET_APP_PORT }}' >> env.tmp

          # Written only when set. `add` always returns 0 on purpose: under
          # `set -e` a bare `[ -n "$x" ] && printf ...` aborts the whole step
          # the first time a value happens to be empty.
          add() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> env.tmp; return 0; }

          add BETTER_AUTH_SECRET "${BETTER_AUTH_SECRET:-}"
          add BETTER_AUTH_URL    "${BETTER_AUTH_URL:-}"
          add TRUSTED_ORIGINS    "${TRUSTED_ORIGINS:-}"
          add FORHU_CHAT_URL     "${FORHU_CHAT_URL:-}"
          add SUPPORT_LANGUAGE   "${SUPPORT_LANGUAGE:-}"

          # DATABASE_URL, RABBITMQ_URL and REDIS_* are deliberately absent: they
          # come from SHARED_ENV on the host and are concatenated ahead of this
          # file, so setting them here would shadow the host's own values.
          # RABBITMQ_DEFAULT_USER/PASS are gone too — those configured the
          # per-project broker the production box runs in compose; this host has
          # one shared broker with a vhost per project.

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "cat ${{ env.SHARED_ENV }} > ${{ env.MERGED_ENV }}"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker rm -f ${{ env.SOCKET_CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
            "docker run -d --name ${{ env.SOCKET_CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.SOCKET_HOST_PORT }}:${{ env.SOCKET_APP_PORT }} ${IMAGE} ${{ env.SOCKET_CMD }}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
