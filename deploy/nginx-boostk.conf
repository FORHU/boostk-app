# nginx vhost for BOOSTK.
#
# Amazon Linux 2023 path — there is no sites-available/sites-enabled pair here
# (that is a Debian convention). Dropping a .conf into conf.d is enough:
#
#   scp deploy/nginx-boostk.conf ec2-user@<host>:/tmp/
#   ssh ec2-user@<host>
#   sudo mv /tmp/nginx-boostk.conf /etc/nginx/conf.d/boostk.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-staging-domain.com
#
# If nginx already serves something on this box, do NOT touch its config.
# This file coexists — nginx routes by server_name.

server {
  listen 80;
  server_name your-staging-domain.com;   # <-- change me

  # Generous, because chat attachments go through here.
  client_max_body_size 25M;

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Better Auth needs this to know the original scheme is https once certbot
    # has run, otherwise it builds http:// callback URLs behind the proxy.
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO. The client appends /socket.io/ itself (no custom path is set in
  # src/hooks/use-socket.ts), so this location is what makes same-origin
  # VITE_SOCKET_URL work.
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # Without these two the WebSocket upgrade fails and socket.io silently
    # degrades to long-polling, reconnecting every ~60s.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 3600s;   # long-lived connections
    proxy_send_timeout 3600s;
  }
}
