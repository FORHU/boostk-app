# Production/staging stack for the BOOSTK EC2 host.
#
# Lives at ~/boostk-app/docker-compose.prod.yaml on the instance.
# ${IMAGE} is exported by .github/workflows/deploy.yml, so every service runs
# the identical commit — app, socket relay, and the migration job.
#
# Copy up with:
#   scp deploy/docker-compose.prod.yaml ec2-user@<host>:~/boostk-app/

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: app.env
    ports:
      # Loopback only — nginx is the sole way in from the internet.
      - "127.0.0.1:5000:5000"
    # Postgres (RDS) and messaging (SNS + SQS) are managed and live outside this stack,
    # so there is nothing local to wait for. Both containers reach AWS with the EC2
    # instance role — see deploy/iam-messaging-policy.json and docs/DEPLOYMENT.md.

  socket:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: app.env
    # Same image, different entrypoint. Bun runs the TypeScript directly.
    command: ["bun", "run", "src/socket-server/index.ts"]
    ports:
      - "127.0.0.1:5001:5001"

# RabbitMQ was a container here until messaging moved to SNS + SQS. remote-deploy.sh
# runs `up --remove-orphans`, so the next deploy removes the leftover container; it
# held no durable state worth keeping (realtime events only).
#
# Postgres was a container here until we moved to RDS. It is gone deliberately:
# a database sharing a host with the app dies with the host, restores by hand, and
# backs itself up never. DATABASE_URL now points at the managed instance and is
# injected whole from the DATABASE_URL GitHub secret.
#
# The old `boostk_data` volume is intentionally NOT removed here — it still holds
# whatever the container database had. `docker compose up` leaves an orphaned
# volume alone, so it stays available for rollback until someone prunes it
# deliberately with `docker volume rm boostk-app_boostk_data`.
